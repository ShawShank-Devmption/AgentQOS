# CI gate (tasks P0.2/P0.6, design.md §11): lint + tests + P4 compile.
# The equivalence gate (ml/verify_equivalence.py) is added to the "test" job in Phase 3 (P3.7).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest scikit-learn pandas pyyaml scapy
      - run: pytest

  controller-py39:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest
      - run: make check-py39 PYTHON39=python

  p4-compile:
    runs-on: ubuntu-22.04
    container: p4lang/p4c@sha256:f15bb88aed8eda8d354da4d02ab7ed1e246f96556d8260100bc98b6ddfe5a71e
    steps:
      - uses: actions/checkout@v4
      - name: Compile top-level P4 programs
        run: |
          p4c-bm2-ss --std p4-16 -o /dev/null p4src/l2fwd.p4
          if [ -f p4src/agent_aware.p4 ]; then
            p4c-bm2-ss --std p4-16 -o /dev/null p4src/agent_aware.p4
          fi

  ptf-parser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make ptf-parser
