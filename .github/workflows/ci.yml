# CI gate (tasks P0.2/P0.6, design.md §11): lint + tests + P4 compile.
# Equivalence gate (P3.7, design 7.9): tests/test_verify_equivalence.py runs in the "test" job;
# the real-corpus run is `python -m ml.verify_equivalence` where the corpus lives.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest scikit-learn pandas matplotlib pyyaml scapy
      - run: python -m ml.generate_headers --check
      - run: make test PYTHON=python

  controller-py39:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest
      - run: make check-py39 PYTHON39=python

  p4-compile:
    runs-on: ubuntu-22.04
    # Existing compiler used for the recorded October 28 checks (p4c 1.2.5.17).
    container: p4lang/p4c@sha256:cce724714a077ed6b476a2a66ca6906fa19dce4d8b385be91e61dfa359477bd3
    steps:
      - uses: actions/checkout@v4
      - name: Compile all P4 programs
        # headers.p4/parser.p4 are includes, not standalone v1model programs.
        run: make build
