events {}

http {
    limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=20r/s;

    server {
        listen 8080;

        location = /health {
            return 200 "ok\n";
        }

        location / {
            limit_req zone=agent_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:8081;
        }
    }
}
